[package]
name = "touchgui"
version = "0.1.0"
description = "TouchGUI — configurable TouchDesigner control panel"
authors = ["TouchGUI"]
edition = "2021"

[lib]
name = "touchgui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
